# navmap CI：单测 + 真实仓回归（u-boot / AetherStack），全部在 GitHub CI 上执行
#
# 拓扑：
#   unit            —— fixture 单测（50+ 用例，验证提取器行为不回归）
#   uboot-regress   —— u-boot v2026.07 全量提取回归：候选数/表数/表项数/USR 完整性断言
#   aether-regress  —— AetherStack master 提取回归：构建目录不进候选 + suggest 冒烟
#
# 触发：push 到 main / 手动 / 每日低峰。单测不过不跑真实仓（needs 串联）。

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 19 * * *'   # UTC 19:23 = 北京 03:23
  workflow_dispatch:

jobs:
  unit:
    name: 单元测试（fixture 回归）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装
        run: python3 -m venv .venv && .venv/bin/pip install -q -e '.[dev]'
      - name: libclang 探测（vendored 20.1.0）
        run: .venv/bin/python -c "from navmap import clangenv; print(clangenv.setup())"
      - name: pytest
        run: .venv/bin/python -m pytest tests/ -q

  uboot-regress:
    name: 真实仓回归 — u-boot（176 万行 C）
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 45
    env:
      NAVMAP: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 navmap
        run: python3 -m venv .venv && .venv/bin/pip install -q -e '.'

      - name: 克隆 u-boot（pin v2026.07）
        run: git clone --depth 1 --branch v2026.07 https://github.com/u-boot/u-boot.git ~/u-boot

      - name: 安装 u-boot 构建依赖
        run: |
          sudo apt-get update -q && sudo apt-get install -q -y \
            libgnutls28-dev libssl-dev libncurses-dev \
            bison flex swig libpython3-dev bc

      - name: 构建 sandbox defconfig 生成 compile_commands.json
        env:
          # NO_PYTHON=1：官方开关，跳过 pylibfdt（swig）构建——它对非系统
          # python 头文件敏感，与 setup-python 注入的 PATH/PYTHON* 冲突
          NO_PYTHON: "1"
        run: |
          cd ~/u-boot
          make sandbox_defconfig
          make -j"$(nproc)" 2>&1 | tail -30
          python3 scripts/gen_compile_commands.py -d . -o compile_commands.json
          python3 - <<'EOF'
          import json
          raw = json.load(open('compile_commands.json'))
          print(f"compdb entries: {len(raw)}")
          assert len(raw) > 500, "compdb 太小，构建可能失败了"
          EOF

      - name: navmap extract 全量
        run: |
          cd ~/u-boot
          BASELINE=$(git rev-parse HEAD)
          "$NAVMAP/.venv/bin/navmap" extract \
            --src "$HOME/u-boot" --compdb compile_commands.json \
            --baseline "$BASELINE" --subsystem uboot --out /tmp/navmap-uboot/ \
            --config "$NAVMAP/config/navmap.toml" 2>&1 | tee /tmp/extract.log

      - name: 回归断言（表数/表项数/USR 完整性/候选量级）
        run: |
          python3 - <<'EOF'
          import json
          art = json.load(open('/tmp/navmap-uboot/navmap-dispatch-uboot.json'))
          tables = art['tables']
          entries = sum(len(t['entries']) for t in tables)
          cands = json.load(open('/tmp/navmap-uboot/navmap-candidates.json'))
          print(f"tables: {len(tables)}, entries: {entries}, candidates: {len(cands)}")
          # README 实测基线：1228 候选 → 19 表 131 表项（sandbox compdb 1246 TU）
          # pin 到 v2026.07 允许漂移，量级不得塌方
          assert len(cands) > 500, "候选数塌方（粗筛回归？）"
          assert len(tables) >= 10, "表数塌方（dispatch 提取回归？）"
          assert entries >= 80, "表项数塌方"
          miss_usr = sum(1 for t in tables for e in t['entries']
                         if not e.get('handler_usr'))
          assert miss_usr == 0, f"{miss_usr} 个表项 USR 缺失（提取器 bug 信号）"
          miss_loc = sum(1 for t in tables for e in t['entries']
                         if not e.get('handler_loc'))
          assert miss_loc == 0, f"{miss_loc} 个表项 handler 位置缺失"
          # X-Macro / 宏表：msg_id 必须是宏拼写（非空）
          miss_id = [e for t in tables for e in t['entries'] if not e.get('msg_id')]
          if miss_id:
              for e in miss_id[:5]:
                  loc_t = None
                  for t in tables:
                      if e in t['entries']:
                          loc_t = t
                          break
                  print(f"msg_id 缺失示例: handler={e['handler']}, "
                        f"表={loc_t['name']}({loc_t['file']}), cond={e.get('cond')}")
          assert not miss_id, f"{len(miss_id)} 个表项 msg_id 缺失"
          EOF

      - name: navmap report 质检（打印供复核）
        run: |
          "$NAVMAP/.venv/bin/navmap" report --out /tmp/navmap-uboot/ --src ~/u-boot \
            > /tmp/navmap-uboot/quality.md || true
          grep -E "^- ERROR " /tmp/navmap-uboot/quality.md | head -20 || true
          grep -E "^- ERROR [0-9]+ / " /tmp/navmap-uboot/quality.md || true

      - name: refresh 增量短路回归
        run: |
          cd ~/u-boot
          "$NAVMAP/.venv/bin/navmap" refresh \
            --src "$HOME/u-boot" --compdb compile_commands.json \
            --subsystem uboot --out /tmp/navmap-uboot/ \
            --config "$NAVMAP/config/navmap.toml"
          # 未 commit 任何变更 → 必须秒级短路且产物不动
          python3 -c "
          import json
          art = json.load(open('/tmp/navmap-uboot/navmap-dispatch-uboot.json'))
          assert art['baseline_commit'] == '$(git rev-parse HEAD)'
          print('refresh short-circuit OK:', art['baseline_commit'][:12])
          "

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uboot-navmap-artifacts
          path: /tmp/navmap-uboot/
          retention-days: 7

  aether-regress:
    name: 真实仓回归 — AetherStack（现代 C++ 5G 协议栈）
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 30
    env:
      NAVMAP: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装 navmap
        run: python3 -m venv .venv && .venv/bin/pip install -q -e '.'

      - name: 克隆 AetherStack master
        run: git clone --depth 1 https://github.com/Atituiset/AetherStack.git ~/aether

      - name: cmake 配置生成 compile_commands.json
        run: |
          cd ~/aether
          cmake -S . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          python3 -c "
          import json
          raw = json.load(open('build/compile_commands.json'))
          print(f'compdb entries: {len(raw)}')
          assert len(raw) > 30, 'compdb 太小，cmake 配置可能失败'
          "

      - name: navmap extract + 构建目录污染回归
        run: |
          BASELINE=$(git -C ~/aether rev-parse HEAD)
          "$NAVMAP/.venv/bin/navmap" extract \
            --src "$HOME/aether" --compdb ~/aether/build/compile_commands.json \
            --baseline "$BASELINE" --subsystem stack --out /tmp/navmap-aether/ \
            --config "$NAVMAP/config/navmap.toml" 2>&1 | tee /tmp/extract-aether.log

          python3 - <<'EOF'
          import json
          cands = json.load(open('/tmp/navmap-aether/navmap-candidates.json'))
          files = [c['file'] for c in cands]
          # 核心回归：构建产物/第三方（build*、_deps、googletest）绝不进候选
          polluted = [f for f in files
                      if any(s in f for s in ('/build/', '/build-asan/', '_deps',
                                               'googletest', 'gmock', 'gtest'))]
          assert not polluted, f"候选被构建目录污染: {polluted[:5]}"
          # AetherStack 是现代 C++（分发经 switch/成员函数，非静态表）——
          # 候选可以为 0，但 parse_failures 里不允许出现构建目录文件
          art = json.load(open('/tmp/navmap-aether/navmap-dispatch-stack.json'))
          bad_fail = [f for f in art['parse_failures'] if '/build' in f]
          assert not bad_fail, f"构建目录文件被尝试解析: {bad_fail[:3]}"
          print(f"candidates: {len(cands)}, tables: {len(art['tables'])}, "
                f"failures: {len(art['parse_failures'])}")
          EOF
      - name: suggest-apis 冒烟（C++ 注册式发现）
        run: |
          "$NAVMAP/.venv/bin/navmap" suggest-apis \
            --src "$HOME/aether" --compdb ~/aether/build/compile_commands.json \
            --threshold 3 --out /tmp/navmap-aether/suggest-apis.md \
            --config "$NAVMAP/config/navmap.toml" | head -30 || true
      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aether-navmap-artifacts
          path: /tmp/navmap-aether/
          retention-days: 7

  seed-regress:
    # M3/M4 验证缺口闭环：对 fork 的 SAST 种子仓跑 registry/globalvar/ops-struct
    # 提取，用真实注册 API 名单断言产出非空（此前 M3/M4 从未在真实仓验证过）。
    name: 种子仓回归 — ${{ matrix.repo }}（M3 registry / M4 globalvar / ops-struct）
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: freeDiameter
            expect: registry
            apis: "fd_disp_register fd_hook_register fd_ext_register"
            vars: "fd_g_config fd_g_svc_mdcallback"
          - repo: collectd
            expect: registry
            apis: "plugin_register_read plugin_register_write plugin_register_log"
            vars: "hostname_g interval_g"
          - repo: pjproject
            expect: registry
            apis: "pjsip_endpt_register_module pjsip_tsx_layer_init"
            vars: "pjsip_var"
          - repo: curl
            expect: ops-struct
            apis: ""
            vars: ""
          - repo: open5gs
            expect: negative-fsm
            apis: "ogs_fsm_init ogs_fsm_create"
            vars: ""
          - repo: usrsctp
            expect: negative-fsm
            apis: ""
            vars: ""
    env:
      NAVMAP: ${{ github.workspace }}
      REPO: ${{ matrix.repo }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装 navmap
        run: python3 -m venv .venv && .venv/bin/pip install -q -e '.'
      - name: 克隆 ${{ matrix.repo }}
        run: git clone --depth 1 https://github.com/Atituiset/${{ matrix.repo }}.git ~/$REPO
      - name: 安装构建工具（open5gs 需要 meson/ninja；collectd 需要 autotools）
        if: matrix.repo == 'open5gs' || matrix.repo == 'collectd'
        run: |
          pip install -q meson ninja
          sudo apt-get update -q && sudo apt-get install -q -y \
            autoconf automake libtool pkg-config bison flex libssl-dev

      - name: 生成 compile_commands.json + navmap 配置
        run: |
          cd ~/$REPO
          case "$REPO" in
            open5gs)
              # meson configure 即产出 compdb（无需 build）
              meson setup build 2>&1 | tail -3
              ;;
            collectd)
              # autotools：configure 后用 make -n 抓不到 compdb，
              # 用 build-aux 的 compile_commands 生成器不可行 →
              # 退路：bear 包 make。装 bear。
              sudo apt-get install -q -y bear
              ./configure 2>&1 | tail -3
              bear -- make -j"$(nproc)" 2>&1 | tail -3
              ;;
            *)
              cmake -S . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON 2>&1 | tail -3
              ;;
          esac
          python3 -c "
          import json, glob, os
          cand = sorted(set(
              glob.glob('build*/compile_commands.json')
              + glob.glob('*/compile_commands.json')
              + [p for p in ['compile_commands.json', 'build/compile_commands.json'] if os.path.isfile(p)]))
          assert cand, 'no compile_commands.json generated'
          raw = json.load(open(cand[0]))
          print('compdb entries:', len(raw))
          assert len(raw) > 10, 'compdb 太小'
          open('/tmp/COMPDB', 'w').write(cand[0])
          "
      - name: navmap extract（真实 API 名单）
        run: |
          cd ~/$REPO
          # 组装配置：register_apis / globalvar 名单 / ops_structs
          python3 - <<EOF
          cfg = open("$NAVMAP/config/navmap.toml").read()
          apis = "$APIS".split()
          gvars = "$VARS".split()
          cfg = cfg.replace(
              'register_apis = ["RegisterHandler", "MsgReg", "RegisterMsgHandler", "MsgRegister"]',
              'register_apis = ' + repr(apis))
          cfg = cfg.replace('variables = []', 'variables = ' + repr(gvars))
          if "$EXPECT" == "ops-struct":
              cfg = cfg.replace('ops_structs = false', 'ops_structs = true')
          open('/tmp/navmap-seed.toml', 'w').write(cfg)
          print("apis:", apis, "vars:", gvars)
          EOF
          BASELINE=$(git rev-parse HEAD)
          "$NAVMAP/.venv/bin/navmap" extract \
            --src "$HOME/$REPO" --compdb "$(cat /tmp/COMPDB)" \
            --baseline "$BASELINE" --subsystem "$REPO" --out /tmp/navmap-$REPO/ \
            --config /tmp/navmap-seed.toml 2>&1 | tail -8
        env:
          REPO: ${{ matrix.repo }}
          APIS: ${{ matrix.apis }}
          VARS: ${{ matrix.vars }}
          EXPECT: ${{ matrix.expect }}
      - name: 按种子形态断言
        run: |
          python3 - <<EOF
          import json, os
          repo = os.environ['REPO']
          expect = os.environ['EXPECT']
          art = json.load(open(f'/tmp/navmap-{repo}/navmap-dispatch-{repo}.json'))
          registry_tables = [t for t in art['tables'] if t['name'].startswith('registry:')]
          ops_tables = [t for t in art['tables'] if not t['name'].startswith('registry:')]
          reg_entries = sum(len(t['entries']) for t in registry_tables)
          ops_entries = sum(len(t['entries']) for t in ops_tables)
          print(f"registry tables: {len(registry_tables)} ({reg_entries} entries), "
                f"other tables: {len(ops_tables)} ({ops_entries} entries)")
          if expect == 'registry':
              assert registry_tables, f"registry 提取 0 命中（M3 验证失败）"
              # USR 完整性
              miss = sum(1 for t in registry_tables for e in t['entries']
                         if not e.get('handler_usr'))
              assert miss == 0, f"{miss} registry 表项 USR 缺失"
          elif expect == 'ops-struct':
              assert ops_entries >= 50, f"ops-struct 提取过少: {ops_entries}"
          elif expect == 'negative-fsm':
              # switch 式 FSM 仓：navmap 不做 switch —— registry/ops 可以有产出，
              # 但预期无表驱动 statemachine 表（量化缺口而非失败）
              print("negative control: switch-FSM blind spot quantified, "
                    f"registry={reg_entries} entries captured")
          gv_path = f'/tmp/navmap-{repo}/navmap-globalvar-{repo}.json'
          if os.path.exists(gv_path):
              gv = json.load(open(gv_path))
              for v in gv['vars']:
                  print(f"globalvar: {v['variable']} refs={v['total_refs']} "
                        f"writers={len(v['writers'])} def={v['def_loc']}")
          EOF
        env:
          REPO: ${{ matrix.repo }}
          EXPECT: ${{ matrix.expect }}
      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seed-${{ matrix.repo }}-artifacts
          path: /tmp/navmap-${{ matrix.repo }}/
          retention-days: 7
